name: Deploy HistoScroll to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "source-current/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply consolidated fixes to current source
        shell: bash
        run: |
          set -euo pipefail
          test -f source-current/index.html
          test -f source-current/app.js
          test -f source-current/style.css
          python deploy/fix_current_source.py source-current
          grep -q "kind:'all'" source-current/app.js
          grep -q "player-top-actions" source-current/index.html
          grep -q "const player=\$('#player'\)" source-current/app.js
          grep -q "histoscroll-pages-v9" source-current/sw.js
          node --check source-current/app.js
          node --check source-current/core.js

      - name: Persist cleaned source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-current
          if ! git diff --cached --quiet; then
            git commit -m "Apply HistoScroll feed and gesture fixes"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source-current

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
