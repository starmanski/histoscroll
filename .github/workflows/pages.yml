name: Deploy HistoScroll to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct HistoScroll source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reconstructed
          cat bundle/part* | base64 --decode > histoscroll-source.zip
          unzip -q histoscroll-source.zip -d reconstructed
          test -f reconstructed/public/index.html
          test -f reconstructed/public/config.js

          python deploy/admin_test_patch.py reconstructed/public
          grep -q "adminDemoBtn" reconstructed/public/index.html

          cat deploy/mobile_v2_parts/part* | base64 --decode | gzip -d > /tmp/mobile_v2.patch
          (
            cd reconstructed
            patch -p1 < /tmp/mobile_v2.patch
          )

          base64 --decode deploy/mobile_v3.patch.gz.b64 | gzip -d > /tmp/mobile_v3.patch
          (
            cd reconstructed
            patch -p1 < /tmp/mobile_v3.patch
          )

          grep -q "favoriteBtn" reconstructed/public/index.html
          grep -q "statusFilter" reconstructed/public/index.html
          grep -q "markCurrentSeen" reconstructed/public/app.js
          grep -q "lastSwipeAt" reconstructed/public/app.js
          grep -q "histoscroll-pages-v6" reconstructed/public/sw.js
          test -f reconstructed/public/pc-generator/HistoScroll_PC_Generator.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reconstructed/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
